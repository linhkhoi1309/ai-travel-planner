name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the secret scan sees every commit

      # A key that was committed and later removed still counts, so scan the
      # whole history, not just the diff. Pinned version, checksum verified.
      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz gitleaks.sha256
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Known vulnerabilities in what ships (session 6/7). Dev tooling is left
      # out, so a new advisory in a test library cannot block an unrelated PR.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Same commands as the README. No `|| true`, no continue-on-error:
      # each step must be able to turn the job red.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
